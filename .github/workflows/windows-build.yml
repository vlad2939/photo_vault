name: Windows build & UI smoke test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (toată soluția)
        run: dotnet build PhotoVault.sln -c Release

      - name: Teste unitare
        run: dotnet test PhotoVault.Tests -c Release --no-build --filter "Category!=RealRaw"

      # Validarea extragerii previzualizării pe fișiere RAW reale (§9 Faza 8), descărcate din surse publice
      - name: Mostre RAW reale (CR2 / NEF / DNG)
        continue-on-error: true
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/download-raw-samples.ps1 -OutDir "${{ runner.temp }}/raw-samples"

      - name: Test pe fișiere RAW reale
        env:
          RAW_SAMPLES_DIR: ${{ runner.temp }}/raw-samples
        run: dotnet test PhotoVault.Tests -c Release --no-build --filter "Category=RealRaw" --logger "console;verbosity=detailed"

      - name: Smoke test UI (pornire aplicație + capturi de ecran)
        shell: powershell
        run: ./.github/scripts/smoke-test.ps1 -Exe "PhotoVault.App/bin/Release/net10.0-windows/PhotoVault.exe" -OutDir "artifacts"

      - name: Upload capturi de ecran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/

      - name: Publicare versiune portabilă (self-contained, un singur .exe)
        run: dotnet publish PhotoVault.App -p:PublishProfile=Portabil

      # Aplicația publicată pornită de pe un „stick", fără .NET; apoi mutată pe „alt calculator" + realiniere foldere
      - name: Test de portabilitate
        shell: powershell
        run: ./.github/scripts/portability-test.ps1 -PublishDir "publish/PhotoVault" -OutDir "portability"

      - name: Upload capturi test de portabilitate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portabilitate
          path: portability/

      - name: Upload versiune portabilă
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-portabil-win-x64
          path: publish/

  # Profiling pe o bibliotecă de 50.000 de poze (§9 Faza 7). Durează ~15–25 min, deci rulează doar
  # la cerere (Run workflow) sau la un commit care conține „[perf]" în mesaj.
  perf-50k:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[perf]')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build PhotoVault.App -c Release

      - name: Test de performanță (50.000 de poze)
        shell: powershell
        run: ./.github/scripts/perf-test.ps1 -Exe "PhotoVault.App/bin/Release/net10.0-windows/PhotoVault.exe" -OutDir "perf"

      - name: Upload rezultate performanță
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performanta-50k
          path: perf/
